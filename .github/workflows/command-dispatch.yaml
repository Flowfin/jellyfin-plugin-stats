# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

# Deny by default. The called workflow acts through the token it is handed, not
# through the job token, so the job needs no scope of its own.
permissions: {}

# One comment is one dispatch, and a later comment does not supersede an earlier
# one, so runs queue per comment instead of cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    secrets:
      token: .
