name: '🔀 PR Rebase Command'

on:
  repository_dispatch:
    types:
      - rebase-command

# Deny by default. The called workflow rebases through the token it is handed,
# so no scope is granted here. This workflow has never run on this repository;
# the scopes a rebase would need belong to the change that makes it run.
permissions: {}

# A rebase must not be cancelled part way through, so runs on one pull request
# queue instead of superseding each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pull_request.number }}
  cancel-in-progress: false

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-rebase.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    with:
      rebase-head: ${{ github.event.client_payload.pull_request.head.label }}
      repository-full-name: ${{ github.event.client_payload.github.payload.repository.full_name }}
      comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
