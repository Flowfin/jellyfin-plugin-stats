# Greppable invariant lint. Several rules in this plan are one grep wide, and a
# rule nothing refuses is an explanation of a rule. The rules live in
# tools/invariants/rules and the near misses that prove each one bites live
# beside them, so adding a rule needs no change to this file.
name: Invariants

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: the lint reads the checked-out tree and nothing else.
permissions:
  contents: read

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    # The check-run name the ruleset will match once this has run green.
    name: Enforce greppable invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not persisted.
          persist-credentials: false

      # First, because a scan by rules that no longer match anything passes
      # every tree quietly. This leg fails if a rule stops firing on its own
      # near miss, if a near miss is missing, or if it fires another rule too.
      - name: Every rule bites its own near miss
        run: bash tools/invariants/lint.sh --self-test

      - name: No invariant is violated in the tree
        run: bash tools/invariants/lint.sh
