# Code scanning over this plugin's own source: its C#, the JavaScript its pages
# ship, and the workflows in this directory.
#
# This workflow used to call jellyfin/jellyfin-meta-plugins/scan-codeql.yaml.
# That analysis ran, but every setting on it lives in a repository nobody
# here can change: the query pack, the severity threshold, and above all the
# path filter. Its findings therefore included the generated sources under
# obj/ and bin/, files that are not in this tree and that nobody reading the
# report can edit. Writing the workflow here puts the configuration beside
# the code it reads.
#
# ONE CONFIGURATION PRODUCES EVERY ANALYSIS THIS BRANCH STANDS ON, and that is
# a property rather than a convenience. Code scanning's default setup covered
# three languages here on 2026-08-28 and uploaded its C# under the category
# this job uses, so it did not add coverage - it replaced the analysis this
# branch stood on with one extracted without a build, and fifty-seven alerts
# closed as fixed on the strength of a scan that compiled nothing. Two
# configurations writing the same category is the shape that permits it, and
# the repair is that no second configuration exists rather than that the two
# are spelled apart. #273 carries the reading.
#
# The trigger filters keep the shape the replaced file reasoned out. The push
# trigger skips documentation-only changes, because a push to master gates
# nothing and the baseline simply stays at the previous analysis. The pull
# request trigger is never filtered: a filter there does not make the check
# red, it stops the check reporting at all, which is what held #129 open.
# The filter for what the analysis READS sits at the init step below.
name: Code scanning

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master]
  # A weekly run so a query pack that learns something new says so against a
  # tree nobody has touched, rather than waiting for the next change.
  schedule:
    - cron: "37 2 * * 4"
  workflow_dispatch:

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

# A new push replaces the run under way. An analysis of a superseded tree says
# nothing about the branch as it now stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # This name is the check context, one per language. The csharp leg keeps
    # the exact name it had before the other two arrived, because changing it
    # removes a context rather than renaming one, and it is changed only
    # together with whatever requires it.
    name: Code scanning (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The upload of the analysis, which is the whole output of this job.
      security-events: write
      # What the uploader reads to find the workflow run it reports against.
      actions: read
    strategy:
      # One language failing to extract must not withdraw the other two
      # analyses from the branch. A leg that does not upload leaves its own
      # category standing at the previous run rather than emptying it.
      fail-fast: false
      matrix:
        include:
          # Compiled, and built by name below.
          - language: csharp
          # The drawing modules under Jellyfin.Plugin.Stats/Pages/ and the
          # node suite beside them. Nothing is compiled, so no build step.
          - language: javascript-typescript
          # The workflows in this directory. zizmor audits them for the
          # security shapes it knows; this reads them with CodeQL's own
          # queries, which is a different set rather than a second copy.
          - language: actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Setup .NET
        # Only the compiled language needs a toolchain.
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both server lines the solution targets.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # The default pack finds security faults. This one adds the quality
          # queries beside them, which is what the other plugins run, and
          # comparing plugins is only meaningful if they run the same set.
          queries: +security-and-quality
          # Path filtering for the ANALYSIS. This block is the reason the
          # workflow lives here: the shared workflow it replaces has no way
          # to carry it. The generated sources under obj/ are not in the
          # tree, and nobody can change them.
          #
          # Nothing else is filtered out. The near misses under
          # tools/invariants/ are tracked source that ships in this
          # repository, and hiding them would be an analysis of part of the
          # tree reported as an analysis of it - the failure this file's
          # build step already refuses one shape of.
          # The second half of the same block is a different statement.
          # paths-ignore says which source is not read; query-filters says
          # which questions are not asked of the source that IS read. Six rule
          # ids are excluded, which is the per-rule decision taken on #263 on
          # 2026-08-28 and applied by #312 - not a fix and not a dismissal, but
          # the third answer that issue offers: the rule is off for this
          # repository.
          #
          # Every one of the six is a readability opinion rather than a fault
          # finder, and this tree already answers style with an analyser set and
          # an editorconfig. Each id carries the reason it is here, because a
          # list of rule ids with no reason beside it is what somebody deletes
          # in a year without being able to tell what it cost.
          #
          # They are named by id and never by language, because this block is
          # shared by the three legs of the matrix above. A filter reaches
          # exactly the ids it names, so no rule outside the six is affected and
          # the security queries are untouched.
          config: |
            paths-ignore:
              - "**/obj/**"
              - "**/bin/**"
            query-filters:
              # A loop that could be a `.Where(...)`. The clearest of its ten
              # sites is the loop over an account's permissions in
              # Jellyfin.Plugin.Stats/Api/CallerIdentity.cs that looks for the
              # administrator flag: satisfying the rule would put an
              # authorization decision behind two lambdas and a deferred
              # sequence, which is a style rule pointed at the wrong thing.
              - exclude:
                  id: cs/linq/missed-where
              # The same family one question over: a loop that could be a
              # `.Select(...)`. Off together with `missed-where` rather than
              # separately, because splitting one opinion into two answers would
              # leave the tree arguing with half of it.
              - exclude:
                  id: cs/linq/missed-select
              # Two nested conditions that could be one. Both sites are in
              # Jellyfin.Plugin.Stats/Data/PlayArchive.cs, where the outer
              # condition and the inner one say different things about a row,
              # and collapsing them would make one sentence out of two facts.
              - exclude:
                  id: cs/nested-if-statements
              # A condition with more operators than the rule allows. Its site
              # is the ordering assertion in the transcode reason breakdown
              # suite, whose condition IS the three-level tie-break the fold
              # sorts by - watched time, then plays, then the server's own name.
              # Stating it in pieces would stop it reading as the ordering.
              - exclude:
                  id: cs/complex-condition
              # A `ContainsKey` followed by an indexer, which the rule reads as
              # one lookup too many. Its site asserts twice about one entry -
              # that a sentence exists, and that it is not blank - with a
              # different message for each, and one `TryGetValue` would collapse
              # two failures a person can act on into one.
              - exclude:
                  id: cs/inefficient-containskey
              # A disposable held in a local rather than in a `using`. Its site
              # is the drain loop in
              # Jellyfin.Plugin.Stats/Data/QueuedPlayWriter.cs, where the store
              # is opened lazily inside the loop and disposed in the outer
              # finally, so it outlives every iteration and a `using` cannot
              # express that lifetime at all.
              - exclude:
                  id: cs/missed-using-statement

      - name: Build what is scanned
        # Built by name rather than by autobuild. Autobuild guesses, and a
        # guess that quietly compiles less than the tree holds is an analysis
        # of part of the source reported as an analysis of it. A build that
        # fails stops the job instead of producing an analysis of whatever
        # did compile.
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          dotnet restore Jellyfin.Plugin.Stats.sln
          dotnet build Jellyfin.Plugin.Stats.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          # One category per language, so the three uploads sit beside each
          # other instead of the last one deciding what the branch stands on.
          category: "/language:${{ matrix.language }}"
