name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  # No path filter here, unlike the push trigger above, and the same reason
  # test.yaml gives for the same absence. This workflow produces a context the
  # ruleset requires, and a workflow that does not run reports nothing, so a
  # filter here leaves a required context that never arrives and a pull request
  # that can never be merged. An analysis of a documentation change is the price
  # of a gate that can close. #86 removed this filter from the build and test
  # workflows when their contexts were the required ones; CodeQL was added to
  # the required set afterwards and brought the same defect back with it.
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

# Deny by default at workflow level; the job below grants only what it needs.
permissions: {}

# A newer run on the same ref supersedes an in-flight one. This is an analysis,
# not a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    permissions:
      # Check the repository out and build it for the analysis.
      contents: read
      # Write the analysis result into the code scanning tab.
      security-events: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    with:
      # The called workflow runs its job only where this matches the repository
      # it is running in. It named the template, so the analysis was skipped on
      # every run this repository has ever made.
      repository-name: iderex/jellyfin-plugin-stats
