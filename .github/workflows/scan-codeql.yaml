name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  # No paths-ignore on the pull request trigger, and putting one back breaks a
  # merge rather than a run. A filter that skips this workflow on a
  # documentation-only change does not make the check red, it stops the check
  # reporting at all, and a required context that never reports leaves the pull
  # request waiting instead of failing, with nothing on the page that looks
  # wrong. That is what happened to #129, which changed only Markdown: the
  # filter had been harmless for as long as nothing depended on this context,
  # and it became a permanent block the moment something did. Whether anything
  # depends on it today is the wrong test, because a filter added here is only
  # noticed once a merge is already stuck.
  #
  # The push trigger above keeps its filter. A push to master gates nothing, so
  # a run skipped there holds nothing open.
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

# Deny by default at workflow level; the job below grants only what it needs.
permissions: {}

# A newer run on the same ref supersedes an in-flight one. This is an analysis,
# not a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    permissions:
      # Check the repository out and build it for the analysis.
      contents: read
      # Write the analysis result into the code scanning tab.
      security-events: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    with:
      # The called workflow runs its job only where this matches the repository
      # it is running in. It named the template, so the analysis was skipped on
      # every run this repository has ever made.
      repository-name: iderex/jellyfin-plugin-stats
