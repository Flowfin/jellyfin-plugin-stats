name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  # No path filter here, unlike the push trigger above. This workflow produces a
  # context the ruleset requires, and a workflow that does not run reports
  # nothing, so filtering the pull request trigger leaves a required context
  # that never arrives and a pull request that can never be merged. A run on a
  # documentation change is the price of a gate that can close.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny by default at workflow level; the job below grants only what it needs.
permissions: {}

# A newer run on the same ref supersedes an in-flight one. This is a build, not
# a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    # The called workflow checks out this repository and builds it. Nothing in it
    # writes, so read is the whole grant.
    permissions:
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    with:
      # The plugin targets net9.0 and net10.0, one per supported server line,
      # and the 9 SDK cannot build the second of those at all. The 10 SDK builds
      # both: it restores the net9.0 reference pack rather than needing a 9
      # install, which was measured on a machine carrying only 10.0.301.
      dotnet-version: '10.0.x'
      # The artifact this call uploads is the 10.11 line's, which is the line
      # build.yaml declares. The 12.0 artifact is built by the packaging
      # workflow, which carries a leg per line.
      dotnet-target: 'net9.0'
