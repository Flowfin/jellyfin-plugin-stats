name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  # No path filter here, unlike the push trigger above. This workflow produces a
  # context the ruleset requires, and a workflow that does not run reports
  # nothing, so filtering the pull request trigger leaves a required context
  # that never arrives and a pull request that can never be merged. A run on a
  # documentation change is the price of a gate that can close.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny by default at workflow level; the job below grants only what it needs.
permissions: {}

# A newer run on the same ref supersedes an in-flight one. This is a build, not
# a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No timeout-minutes: GitHub refuses the key on a job that calls a reusable
  # workflow, and the refusal is quoted in the pull request that added this line.
  call:
    # The called workflow checks out this repository and builds it. Nothing in it
    # writes, so read is the whole grant.
    permissions:
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
    with:
      # The plugin targets net9.0 and net10.0, one per supported server line,
      # and the 9 SDK cannot build the second of those at all. The 10 SDK builds
      # both: it restores the net9.0 reference pack rather than needing a 9
      # install, which was measured on a machine carrying only 10.0.301.
      dotnet-version: '10.0.x'
      # The artifact this call uploads is the 10.11 line's, which is the line
      # build.yaml declares. The 12.0 artifact is built by the packaging
      # workflow, which carries a leg per line.
      dotnet-target: 'net9.0'

  # The build above resolves whatever the projects ask for. These two prove the
  # plugin still compiles against the OLDEST server release in each supported
  # line, which is the only version every server on that line is guaranteed to
  # have. A call added against a newer release compiles green above and fails to
  # load for everybody still on the floor.
  #
  # One job per line so each is a context of its own that the ruleset can require
  # separately, and so a red one says which line broke without reading a log.
  floor:
    name: ABI floor build (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Both legs run whatever the other does. A failure on one line is not a
      # reason to stop learning whether the other one also broke.
      fail-fast: false
      matrix:
        include:
          - line: '10.11'
            framework: net9.0
            floor-property: JellyfinFloorNet9
            # build.yaml declares this line's targetAbi to the server. The step
            # below checks it against the floor, because the two are one claim
            # written twice: an abi of 10.11.0.0 is only honest if the assembly
            # was built against the 10.11.0 packages.
            declared-abi: '10.11.0.0'
          - line: '12.0'
            framework: net10.0
            floor-property: JellyfinFloorNet10
            # Empty, and this is a gap rather than an omission. The 12.0 line's
            # targetAbi is not a value in this tree: the packaging workflow
            # substitutes it into a copy of build.yaml at package time, so there
            # is nothing here to compare the floor against.
            declared-abi: ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not persisted.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The 10 SDK builds both frameworks; the 9 SDK cannot build net10.0.
          dotnet-version: '10.0.x'

      # Read out of the tree rather than written here. A floor typed into this
      # file would be a second place to change, which is the state this job
      # exists to keep the repository out of.
      - name: Read the declared floor
        id: floor
        run: |
          set -euo pipefail
          floor=$(dotnet msbuild Jellyfin.Plugin.Stats/Jellyfin.Plugin.Stats.csproj \
            -getProperty:${{ matrix.floor-property }} -nologo | tr -d '[:space:]')
          if [ -z "${floor}" ]; then
            echo "${{ matrix.floor-property }} is empty. Directory.Build.props is where it is declared." >&2
            exit 1
          fi
          echo "The ${{ matrix.line }} line declares floor ${floor}."
          echo "floor=${floor}" >> "$GITHUB_OUTPUT"

      - name: Build against the floor
        run: dotnet build Jellyfin.Plugin.Stats/Jellyfin.Plugin.Stats.csproj -f ${{ matrix.framework }} --nologo

      # The build above passes as long as the graph restores, whatever version
      # that graph holds. This step reads what was actually resolved and refuses
      # anything but the declared floor, so a version written into a project file
      # instead of read from Directory.Build.props is red here rather than a
      # quiet upgrade nobody sees.
      - name: What was resolved is the floor and nothing above it
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          floor = os.environ["FLOOR"]
          framework = os.environ["FRAMEWORK"]

          with open("Jellyfin.Plugin.Stats/packages.lock.json", encoding="utf-8") as handle:
              locked = json.load(handle)["dependencies"]

          if framework not in locked:
              sys.exit("packages.lock.json holds no {0} section.".format(framework))

          failed = False
          for package in ("Jellyfin.Controller", "Jellyfin.Model"):
              entry = locked[framework].get(package)
              if entry is None:
                  print("FAIL {0} is not a direct reference under {1}".format(package, framework))
                  failed = True
                  continue
              resolved = entry.get("resolved")
              if resolved != floor:
                  print(
                      "FAIL {0} resolved to {1}, and the declared floor is {2}. "
                      "A version belongs in Directory.Build.props, not in a project "
                      "file.".format(package, resolved, floor)
                  )
                  failed = True
              else:
                  print("ok   {0} resolved to the floor {1}".format(package, resolved))

          sys.exit(1 if failed else 0)
          PY

      # Only where the tree holds the abi. The condition is the disclosure: on
      # the line where this does not run, nothing compares the two.
      - name: The manifest abi agrees with the floor
        if: matrix.declared-abi != ''
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          DECLARED_ABI: ${{ matrix.declared-abi }}
        run: |
          set -euo pipefail
          in_manifest=$(grep -E '^targetAbi:' build.yaml | sed -E 's/^targetAbi:[ ]*"(.*)"$/\1/')
          if [ "${in_manifest}" != "${DECLARED_ABI}" ]; then
            echo "build.yaml declares targetAbi ${in_manifest}; this job was written against ${DECLARED_ABI}." >&2
            exit 1
          fi
          if [ "${in_manifest}" != "${FLOOR}.0" ]; then
            echo "targetAbi ${in_manifest} and floor ${FLOOR} are different servers." >&2
            echo "The manifest tells a server it may install this plugin; the floor is what the plugin was built against." >&2
            exit 1
          fi
          echo "targetAbi ${in_manifest} matches the floor ${FLOOR}."
