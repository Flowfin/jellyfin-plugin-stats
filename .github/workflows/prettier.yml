# Formatting gate over the assets this plugin ships into the dashboard. Churn in
# an HTML or JavaScript file hides the real change in a diff, and nothing else in
# the tree formats them.
#
# The job checks and never writes. It has no token scope to write with either,
# so a version of this that tried to push a fix would fail rather than commit.
name: Prettier

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: the check reads the checked-out tree and nothing else.
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one. This is a format
# check, not a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    # The check-run name the ruleset can match once this has run green.
    name: Check page asset formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not persisted.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # An exact version rather than a range: a formatter that moves on its own
      # turns an unrelated pull request red for a reason nobody changed. What
      # this cannot pin is the package contents, because there is no lock file
      # in the tree to pin them with; the version number is the whole guarantee.
      - name: Check formatting
        run: npx --yes prettier@3.9.6 --check .
