version: "0.0.0.0"
# The 10.11 server line, which runs on .NET 9. This file is one manifest and
# jprm reads one targetAbi out of it, so the 12.0 line's artifact is packaged
# from a copy of this file with these two keys replaced; the packaging workflow
# is where that happens and it replaces nothing else. The version above stays
# the one place a version is written.
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Playback statistics, kept private to the user they are about"
description: >
  Records what was played on this server and shows it back as statistics: usage
  over time, the clients and devices people play from, and how often the server
  had to transcode. Personal detail is visible only to the user it is about
  unless that user chooses otherwise, and server-wide views name nobody.
category: "Administration"
owner: "Flowfin"
artifacts:
- "Jellyfin.Plugin.Stats.dll"
# Required by the packaging tool: without this key it fails with KeyError.
# The entries themselves are in CHANGELOG.md, which is the one place they are
# written.
changelog: >
  The entries for each release are in CHANGELOG.md in the repository.
