overview: "Playback statistics, kept private to the user they are about"
description: >
  Records what was played on this server and shows it back as statistics: usage
  over time, the clients and devices people play from, and how often the server
  had to transcode. Personal detail is visible only to the user it is about
  unless that user chooses otherwise, and server-wide views name nobody.
