---
name: "Playback Statistics"
guid: "29e90267-52ee-4bec-b4fb-870b8f5ddc53"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-stats/master/img/logo.png"
# The number a release carries says which server line it is for, not how
# settled the plugin is. This file is the 10.11 line and its stream starts at
# 0.1.0.0; the 12.0 line's stream starts at 1.0.0.0. Issue #133 is where that
# was settled and README.md says the same thing where a reader meets the
# number.
version: "0.1.0.0"
# The 10.11 server line, which runs on .NET 9. This file is one manifest and
# jprm reads one targetAbi out of it, so the 12.0 line's artifact is packaged
# from a copy of this file with these two keys replaced; the packaging workflow
# is where that happens and it replaces nothing else. The version above stays
# the one place a version is written.
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Playback statistics, kept private to the user they are about"
# What the installed version does and nothing it does not. The views that show
# usage over time, clients and devices and transcoding are built and are not
# shown yet: the dashboard cannot run them as served, so no page but the
# settings page is declared until they render, which is issue #335. Naming
# them here before then promises a page an administrator opens and finds
# blank.
description: >
  Records what was played on this server, one row per finished play, in a
  SQLite file of its own. An administrator sets what is captured and for how
  long it is kept on the settings page. A signed-in user reads their own
  figures, their own year and their own consent over the server's API, and
  deletes their own history there; nobody reads another person's rows. No
  statistics page is shown in the dashboard yet.
category: "Administration"
owner: "Flowfin"
artifacts:
- "Jellyfin.Plugin.Stats.dll"
# One sentence per release, newest first, in the shape a catalogue shows
# under the version. CHANGELOG.md carries the entries in full; this carries
# what a person choosing a version in the dashboard reads, so a version with
# nothing under it is not a state this file may reach. The next release adds
# its line above the last one in the same change that raises the version.
changelog: |
  0.1.0.0: First release on the 10.11 line. Records one row per finished play into a SQLite file of its own, with a settings page for what is captured and how long it is kept, and three routes a signed-in user opens about themselves: their year, their consent, and the deletion of their own history. Binds Microsoft.Data.Sqlite 9.0.11.0, which a 10.11.0 server does not ship, so on that server it loads and then records nothing; 0.1.1.0 repairs that.
