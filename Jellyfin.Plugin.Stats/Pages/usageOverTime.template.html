<div
    id="stats-usage-over-time-page"
    data-role="page"
    class="page type-interior pluginConfigurationPage"
>
    <div data-role="content">
        <div class="content-primary">
            <h1>Usage over time</h1>

            <form id="stats-usage-range" class="stats-range">
                <label for="stats-usage-days">Days to show</label>
                <input id="stats-usage-days" type="number" min="1" step="1" value="30" />
                <label for="stats-usage-figure">Figure</label>
                <select id="stats-usage-figure">
                    <option value="plays">Plays per day</option>
                    <option value="watchedMinutes">Minutes watched per day</option>
                </select>
                <button type="submit">Show</button>
            </form>

            <p id="stats-usage-bound" class="stats-range-bound"></p>

            <div id="stats-usage-view"></div>
        </div>
    </div>

    <script id="stats-page-code"></script>

    <script>
        mountUsageOverTime(
            document.querySelector('#stats-usage-over-time-page'),
            ApiClient,
            function () {
                return new Date();
            },
        );
    </script>
</div>
